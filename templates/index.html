<!DOCTYPE html>
<html>
<head>
    <title>Інтерактивна карта Чорнухинської ОТГ</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
        #sidebar {
            width: 100%;
            height: 180px;
            overflow-y: hidden;
            overflow-x: auto;
            padding: 10px;
            background-color: #f8f8f8;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            border-top: 1px solid #eee;
        }
        #sidebar-content {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        #sidebar h2 {
            margin: 0;
            padding-right: 10px;
            flex-shrink: 0;
        }
        #route-points {
            margin: 0;
            padding: 0;
            display: flex;
            list-style: none;
            flex-grow: 1;
            gap: 10px;
        }
        #route-points li {
            padding: 5px 10px;
            background-color: #fff;
            border-radius: 3px;
            flex-shrink: 0;
            border: 1px solid #ddd;
        }
        .popup-content img {
            max-width: 100%;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .popup-content button, #sidebar button {
            padding: 8px 15px;
            font-size: 0.9em;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 0;
            flex-shrink: 0;
        }
        .popup-content button:hover, #sidebar button:hover {
            background-color: #0056b3;
        }
        #clearRouteBtn {
            background-color: #dc3545 !important;
        }
        #status-message {
            flex-shrink: 0;
            font-style: italic;
            color: #555;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="sidebar">
        <div id="sidebar-content">
            <h2>Маршрут:</h2>
            <ul id="route-points"></ul>
            <span id="status-message"></span>
            <button id="buildRouteBtn" style="display:none;">Створити маршрут</button>
            <button id="clearRouteBtn" style="display:none;">Очистити</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
        const map = L.map('map').setView([50.2733, 32.9383], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let routeWaypoints = [];
        const routePointsList = document.getElementById('route-points');
        const buildRouteBtn = document.getElementById('buildRouteBtn');
        const clearRouteBtn = document.getElementById('clearRouteBtn');
        const statusMessage = document.getElementById('status-message');
        let routingControl = null;

        function createPopupContent(location) {
            const container = document.createElement('div');
            container.className = 'popup-content';
            container.innerHTML += `<h3>${location.name}</h3>`;
            if (location.photo) {
                container.innerHTML += `<img src="${location.photo}" alt="${location.name}">`;
            }
            const addButton = document.createElement('button');
            addButton.innerText = "Додати до маршруту";
            addButton.onclick = () => addToRoute(location);
            container.appendChild(addButton);
            return container;
        }

        function addToRoute(location) {
            // Corrected the check to access .lat and .lng directly on the waypoint object
            if (routeWaypoints.find(wp => wp.lat === location.lat && wp.lng === location.lng)) {
                alert(`${location.name} вже у вашому маршруті.`);
                return;
            }
            const waypoint = L.latLng(location.lat, location.lng);
            routeWaypoints.push(waypoint);

            const li = document.createElement('li');
            li.innerText = location.name;
            routePointsList.appendChild(li);

            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
            }

            if (routeWaypoints.length >= 2) {
                buildRouteBtn.style.display = 'block';
            }
            clearRouteBtn.style.display = 'block';
            statusMessage.innerText = '';
        }
        
        function drawRoute() {
            if (routeWaypoints.length < 2) return;

            buildRouteBtn.style.display = 'none';
            statusMessage.innerText = 'Будуємо маршрут...';

            routingControl = L.Routing.control({
                waypoints: routeWaypoints,
                routeWhileDragging: true,
                show: false,
                addWaypoints: false
            })
            .on('routesfound', function(e) {
                console.log('Route found:', e.routes[0]);
                statusMessage.innerText = `Маршрут знайдено. Довжина: ${(e.routes[0].summary.totalDistance / 1000).toFixed(2)} км.`;
            })
            .on('routingerror', function(e) {
                console.error('Routing error:', e);
                alert('Не вдалося побудувати маршрут. Спробуйте інші точки або повторіть спробу пізніше.');
                statusMessage.innerText = 'Помилка побудови маршруту.';
                buildRouteBtn.style.display = 'block';
            })
            .addTo(map);
        }

        function clearRoute() {
            routeWaypoints = [];
            routePointsList.innerHTML = '';
            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
            }
            buildRouteBtn.style.display = 'none';
            clearRouteBtn.style.display = 'none';
            statusMessage.innerText = '';
        }
        
        buildRouteBtn.addEventListener('click', drawRoute);
        clearRouteBtn.addEventListener('click', clearRoute);

        fetch('/api/locations')
            .then(response => response.json())
            .then(data => {
                data.forEach(location => {
                    if(location.lat && location.lng) {
                        const marker = L.marker([location.lat, location.lng]).addTo(map);
                        marker.bindPopup(createPopupContent(location));
                    }
                });
            })
            .catch(error => {
                console.error('Error fetching locations:', error);
                statusMessage.innerText = 'Помилка завантаження локацій.';
            });
    </script>
</body>
</html>
