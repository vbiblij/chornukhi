<!DOCTYPE html>
<html>
<head>
    <title>Ukraine Map Tour</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 90%; width: 100%; }
        #header { height: 10%; padding: 10px; box-sizing: border-box; text-align: center; }
        #status { font-size: 1.2em; }
    </style>
</head>
<body>
    <div id="header">
        <h1>Чорнухинська ОТГ</h1>
        <div id="status">Status: Initializing...</div>
    </div>
    <div id="map"></div>

    <script>
        const map = L.map('map').setView([48.3794, 31.1656], 6); // Centered on Ukraine

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        const statusDiv = document.getElementById('status');

        let lastStatus = "";
        let lastLat = 0, lastLon = 0, lastZoom = 0;

        setInterval(function() {
            fetch('/api/data')
                .then(response => response.json())
                .then(data => {
                    const camera = data.camera;
                    const status = data.status;

                    // Update status text if it has changed
                    if (status !== lastStatus) {
                        statusDiv.textContent = 'Status: ' + status;
                        lastStatus = status;
                    }
                    
                    // Update map view if it has changed
                    if (camera.lat !== lastLat || camera.lon !== lastLon || camera.zoom !== lastZoom) {
                        map.flyTo([camera.lat, camera.lon], Math.round(camera.zoom), {
                            animate: true,
                            duration: 1.5 // animation duration in seconds
                        });
                        lastLat = camera.lat;
                        lastLon = camera.lon;
                        lastZoom = camera.zoom;
                    }
                })
                .catch(error => {
                    statusDiv.textContent = 'Status: Connection error';
                    console.error('Error fetching data:', error);
                });
        }, 300); // Poll every 300ms for smoother updates
    </script>
</body>
</html>
