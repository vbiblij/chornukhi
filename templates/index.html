<!DOCTYPE html>
<html>
<head>
    <title>Ukraine Map Tour</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; }
        #header { height: 10%; padding: 10px; box-sizing: border-box; text-align: center; background-color: #f8f8f8; border-bottom: 1px solid #eee; position: relative; z-index: 1000; }
        #map { height: 90%; width: 100%; position: relative; z-index: 1; }
        #status { font-size: 1.2em; margin-bottom: 10px; }
        #startTourBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            font-size: 1.1em;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000; /* Ensure button is above the map */
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #startTourBtn:hover {
            background-color: #0056b3;
        }
        #startTourBtn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>Чорнухинська ОТГ</h1>
        <div id="status">Status: Initializing...</div>
    </div>
    <div id="map"></div>
    <button id="startTourBtn">Start Tour</button>

    <script>
        const map = L.map('map').setView([48.3794, 31.1656], 6); // Centered on Ukraine

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('startTourBtn');

        startBtn.addEventListener('click', () => {
            console.log('Starting tour...');
            startBtn.disabled = true;
            statusDiv.textContent = 'Status: Starting simulation...';

            fetch('/start_tour', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    console.log(data.message);
                    statusDiv.textContent = 'Status: ' + data.message;
                })
                .catch(error => {
                    console.error('Error starting tour:', error);
                    statusDiv.textContent = 'Status: Error starting tour.';
                    startBtn.disabled = false; // Re-enable button on error
                });
        });

        let lastStatus = "";
        let lastLat = 0, lastLon = 0, lastZoom = 0;

        setInterval(function() {
            fetch('/api/data')
                .then(response => response.json())
                .then(data => {
                    const camera = data.camera;
                    const status = data.status;

                    // Update status text if it has changed
                    if (status !== lastStatus) {
                        statusDiv.textContent = 'Status: ' + status;
                        lastStatus = status;

                        // Re-enable button if tour is finished and button is disabled
                        if (status.includes("Finished") && startBtn.disabled) {
                            startBtn.disabled = false;
                        }
                    }
                    
                    // Update map view if it has changed. Use setView for direct control.
                    if (camera.lat !== lastLat || camera.lon !== lastLon || camera.zoom !== lastZoom) {
                        map.setView([camera.lat, camera.lon], Math.round(camera.zoom));
                        lastLat = camera.lat;
                        lastLon = camera.lon;
                        lastZoom = camera.zoom;
                    }
                })
                .catch(error => {
                    statusDiv.textContent = 'Status: Connection error';
                    console.error('Error fetching data:', error);
                });
        }, 50); // Poll every 50ms for smoother updates
    </script>

</body>
</html>
