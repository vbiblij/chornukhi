<!DOCTYPE html>
<html>
<head>
    <title>Інтерактивна карта Чорнухинської ОТГ</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            display: flex;
            flex-direction: column; /* Stack map and sidebar vertically */
        }
        #map {
            flex-grow: 1; /* Map takes all available vertical space */
            width: 100%;
        }
        #sidebar {
            width: 100%; /* Sidebar takes full width */
            height: 180px; /* Fixed height for the horizontal sidebar */
            overflow-y: hidden; /* Hide vertical scrollbar */
            overflow-x: auto; /* Enable horizontal scrollbar if content overflows */
            padding: 10px; /* Reduced padding */
            background-color: #f8f8f8;
            display: flex; /* Use flexbox for internal layout */
            align-items: center; /* Vertically center items */
            gap: 10px; /* Space between items */
            white-space: nowrap; /* Prevent items from wrapping */
            border-top: 1px solid #eee;
        }
        #sidebar h2 {
            margin: 0; /* Remove margin */
            padding-right: 10px; /* Space from title to content */
            flex-shrink: 0; /* Prevent title from shrinking */
        }
        #route-points {
            margin: 0; /* Remove default margin */
            padding: 0; /* Remove default padding */
            display: flex; /* Make list items horizontal */
            list-style: none; /* Remove bullet points */
            flex-grow: 1; /* Allow route points to take space */
            gap: 10px; /* Space between list items */
        }
        #route-points li {
            padding: 5px 10px; /* Adjust padding */
            background-color: #fff;
            border-radius: 3px;
            flex-shrink: 0; /* Prevent items from shrinking */
        }
        .popup-content img {
            max-width: 100%;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .popup-content button, #sidebar button {
            padding: 8px 15px; /* Adjust button padding */
            font-size: 0.9em; /* Adjust font size */
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 0; /* Remove margin */
            flex-shrink: 0; /* Prevent buttons from shrinking */
        }
        .popup-content button:hover, #sidebar button:hover {
            background-color: #0056b3;
        }
        #sidebar button {
            background-color: #007bff;
        }
        #clearRouteBtn {
            background-color: #dc3545 !important;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="sidebar">
        <h2>Маршрут:</h2>
        <ul id="route-points"></ul>
        <button id="buildRouteBtn" style="display:none;">Побудувати маршрут</button>
        <button id="clearRouteBtn" style="display:none;">Очистити</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
        // 1. Initialize Map
        const map = L.map('map').setView([50.2733, 32.9383], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 2. State Management
        let routeWaypoints = [];
        let locationsData = [];
        const routePointsList = document.getElementById('route-points');
        const buildRouteBtn = document.getElementById('buildRouteBtn');
        const clearRouteBtn = document.getElementById('clearRouteBtn');
        let routingControl = null;

        // 3. Functions
        function createPopupContent(location) {
            const container = document.createElement('div');
            container.className = 'popup-content';
            container.innerHTML += `<h3>${location.name}</h3>`;
            if (location.photo) {
                container.innerHTML += `<img src="${location.photo}" alt="${location.name}">`;
            }
            const addButton = document.createElement('button');
            addButton.innerText = "Додати до маршруту";
            addButton.onclick = () => addToRoute(location);
            container.appendChild(addButton);
            return container;
        }

        function addToRoute(location) {
            if (routeWaypoints.find(wp => wp.latLng.lat === location.lat && wp.latLng.lng === location.lng)) {
                alert(`${location.name} вже у вашому маршруті.`);
                return;
            }
            const waypoint = L.latLng(location.lat, location.lng);
            routeWaypoints.push(waypoint);

            const li = document.createElement('li');
            li.innerText = location.name;
            routePointsList.appendChild(li);

            // Hide build button if route is currently drawn
            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
            }

            if (routeWaypoints.length >= 2) {
                buildRouteBtn.style.display = 'block';
            }
            clearRouteBtn.style.display = 'block';
        }
        
        function drawRoute() {
            if (routingControl) {
                map.removeControl(routingControl);
            }
            if (routeWaypoints.length < 2) return;

            routingControl = L.Routing.control({
                waypoints: routeWaypoints,
                routeWhileDragging: true,
                show: false,
                addWaypoints: false
            }).addTo(map);
            buildRouteBtn.style.display = 'none';
        }

        function clearRoute() {
            routeWaypoints = [];
            routePointsList.innerHTML = '';
            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
            }
            buildRouteBtn.style.display = 'none';
            clearRouteBtn.style.display = 'none';
        }
        
        buildRouteBtn.addEventListener('click', drawRoute);
        clearRouteBtn.addEventListener('click', clearRoute);

        // 4. Initial Data Fetch
        fetch('/api/locations')
            .then(response => response.json())
            .then(data => {
                locationsData = data;
                locationsData.forEach(location => {
                    if(location.lat && location.lng) {
                        const marker = L.marker([location.lat, location.lng]).addTo(map);
                        marker.bindPopup(createPopupContent(location));
                    }
                });
            })
            .catch(error => console.error('Error fetching locations:', error));
    </script>
</body>
</html>
